<!-- OnCourse Global Reusable Component: Sticky CTA Bar (Black & White Wireframe) -->
<!-- Appears on scroll > 280px, dismissible per session -->
<div id="sticky-cta-bar" class="fixed bottom-0 inset-x-0 z-40 bg-black text-white shadow-2xl border-t border-gray-800 transform translate-y-full opacity-0 pointer-events-none transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-3.5">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <!-- Copy / Value Prop -->
      <div class="flex items-center space-x-3 text-center sm:text-left">
        <span class="hidden sm:inline-flex w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span>
        <div>
          <p class="text-sm font-semibold text-white">
            Plan your global admissions roadmap with senior mentors
          </p>
          <p class="text-xs text-gray-400 hidden md:block">
            Targeting Ivy League, Top 20 US, Oxford, Cambridge, and Top Global MBA Programs.
          </p>
        </div>
      </div>

      <!-- Actions: CTA Button + Dismiss Button -->
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
        <a href="contact.html#consultation-form" id="sticky-cta-btn" data-open-modal="consultation" class="flex-1 sm:flex-none text-center px-4 py-2 rounded-md bg-white hover:bg-gray-200 text-black font-bold text-xs uppercase tracking-wider shadow-sm transition-all cursor-pointer">
          Request a Consultation
        </a>
        <button id="sticky-cta-dismiss" type="button" class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-gray-800 transition-colors" aria-label="Dismiss sticky notification">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>
